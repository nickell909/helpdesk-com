<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head th:replace="~{fragments/layout :: head}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container-fluid">
    <div class="row">
        <main class="col-md-12 ms-sm-auto px-md-4">
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                <h1 class="h2"><i class="bi bi-ticket-detailed"></i> Заявки</h1>
                <div class="btn-toolbar mb-2 mb-md-0">
                    <a href="/tickets/new" class="btn btn-primary">
                        <i class="bi bi-plus-lg"></i> Создать заявку
                    </a>
                </div>
            </div>

            <!-- Filters -->
            <div class="card mb-4">
                <div class="card-body">
                    <div class="row g-3">
                        <div class="col-md-3">
                            <label for="filterStatus" class="form-label">Статус</label>
                            <select class="form-select" id="filterStatus">
                                <option value="">Все статусы</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label for="filterPriority" class="form-label">Приоритет</label>
                            <select class="form-select" id="filterPriority">
                                <option value="">Все приоритеты</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label for="filterCategory" class="form-label">Категория</label>
                            <select class="form-select" id="filterCategory">
                                <option value="">Все категории</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label for="filterSearch" class="form-label">Поиск</label>
                            <input type="text" class="form-control" id="filterSearch" placeholder="Поиск по номеру или заголовку">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Tickets Table -->
            <div class="card">
                <div class="card-body">
                    <div id="loading" class="text-center py-5">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">Загрузка...</span>
                        </div>
                    </div>

                    <div id="tickets-container" class="d-none">
                        <div class="table-responsive">
                            <table class="table table-hover">
                                <thead>
                                <tr>
                                    <th>Номер</th>
                                    <th>Заголовок</th>
                                    <th>Категория</th>
                                    <th>Приоритет</th>
                                    <th>Статус</th>
                                    <th>Автор</th>
                                    <th>Назначена</th>
                                    <th>Создана</th>
                                    <th>Обновлена</th>
                                    <th>Действия</th>
                                </tr>
                                </thead>
                                <tbody id="tickets-list"></tbody>
                            </table>
                        </div>

                        <div id="empty-state" class="text-center py-5 d-none">
                            <i class="bi bi-search text-muted" style="font-size: 3rem;"></i>
                            <p class="text-muted mt-3">Заявки не найдены</p>
                        </div>

                        <div class="mt-3">
                            <p class="text-muted">Найдено заявок: <span id="tickets-count" class="fw-bold">0</span></p>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:replace="~{fragments/layout :: scripts}"></div>

<script>
    let allTickets = [];
    let categories = [];
    let priorities = [];
    let statuses = [];

    async function loadTicketsPage() {
        try {
            // Load reference data
            [categories, priorities, statuses, allTickets] = await Promise.all([
                getCategories(),
                getPriorities(),
                getStatuses(),
                getTickets()
            ]);

            // Populate filters
            populateFilters();

            // Display tickets
            filterAndDisplayTickets();

            document.getElementById('loading').classList.add('d-none');
            document.getElementById('tickets-container').classList.remove('d-none');

        } catch (error) {
            console.error('Error loading tickets:', error);
            showAlert('Ошибка загрузки заявок: ' + error.message, 'danger');
        }
    }

    function populateFilters() {
        const filterStatus = document.getElementById('filterStatus');
        const filterPriority = document.getElementById('filterPriority');
        const filterCategory = document.getElementById('filterCategory');

        statuses.forEach(status => {
            const option = document.createElement('option');
            option.value = status.statusId;
            option.textContent = status.name;
            filterStatus.appendChild(option);
        });

        priorities.forEach(priority => {
            const option = document.createElement('option');
            option.value = priority.priorityId;
            option.textContent = priority.name;
            filterPriority.appendChild(option);
        });

        categories.forEach(category => {
            const option = document.createElement('option');
            option.value = category.categoryId;
            option.textContent = category.name;
            filterCategory.appendChild(option);
        });

        // Add filter event listeners
        filterStatus.addEventListener('change', filterAndDisplayTickets);
        filterPriority.addEventListener('change', filterAndDisplayTickets);
        filterCategory.addEventListener('change', filterAndDisplayTickets);
        document.getElementById('filterSearch').addEventListener('input', filterAndDisplayTickets);
    }

    function filterAndDisplayTickets() {
        const statusFilter = document.getElementById('filterStatus').value;
        const priorityFilter = document.getElementById('filterPriority').value;
        const categoryFilter = document.getElementById('filterCategory').value;
        const searchFilter = document.getElementById('filterSearch').value.toLowerCase();

        let filtered = allTickets.filter(ticket => {
            const matchesStatus = !statusFilter || ticket.status.statusId == statusFilter;
            const matchesPriority = !priorityFilter || ticket.priority.priorityId == priorityFilter;
            const matchesCategory = !categoryFilter || ticket.category.categoryId == categoryFilter;
            const matchesSearch = !searchFilter ||
                ticket.ticketNumber.toLowerCase().includes(searchFilter) ||
                ticket.title.toLowerCase().includes(searchFilter);

            return matchesStatus && matchesPriority && matchesCategory && matchesSearch;
        });

        displayTickets(filtered);
    }

    function displayTickets(tickets) {
        const tbody = document.getElementById('tickets-list');
        const emptyState = document.getElementById('empty-state');
        const userInfo = getUserInfo();

        document.getElementById('tickets-count').textContent = tickets.length;

        if (tickets.length === 0) {
            tbody.innerHTML = '';
            emptyState.classList.remove('d-none');
            return;
        }

        emptyState.classList.add('d-none');

        tbody.innerHTML = tickets.map(ticket => `
            <tr class="ticket-priority-${getPriorityClass(ticket.priority.name)}">
                <td>
                    <a href="/tickets/${ticket.ticketId}" class="text-decoration-none fw-bold">
                        ${ticket.ticketNumber}
                    </a>
                </td>
                <td>
                    <div>${ticket.title}</div>
                    ${ticket.description ? `<small class="text-muted">${ticket.description.substring(0, 50)}${ticket.description.length > 50 ? '...' : ''}</small>` : ''}
                </td>
                <td><span class="badge bg-secondary">${ticket.category.name}</span></td>
                <td><span class="badge bg-${getPriorityColor(ticket.priority.name)}">${ticket.priority.name}</span></td>
                <td><span class="badge status-badge-${getStatusClass(ticket.status.name)}">${ticket.status.name}</span></td>
                <td>
                    <small>${ticket.createdBy.fullName}</small>
                </td>
                <td>
                    <small>${ticket.assignedTo ? ticket.assignedTo.fullName : '<span class="text-muted">Не назначена</span>'}</small>
                </td>
                <td class="text-muted small">${formatDate(ticket.createdAt)}</td>
                <td class="text-muted small">${formatDate(ticket.updatedAt)}</td>
                <td>
                    <a href="/tickets/${ticket.ticketId}" class="btn btn-sm btn-outline-primary">
                        <i class="bi bi-eye"></i>
                    </a>
                </td>
            </tr>
        `).join('');
    }

    function getPriorityColor(priority) {
        const colors = {
            'Низкий': 'success',
            'Средний': 'warning',
            'Высокий': 'orange',
            'Критический': 'danger'
        };
        return colors[priority] || 'secondary';
    }

    document.addEventListener('DOMContentLoaded', loadTicketsPage);
</script>
</body>
</html>
